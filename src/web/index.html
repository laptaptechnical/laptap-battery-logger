<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Logger v14</title>
<style>
/* Finale-look desktop tool: header bar, one stats row, chart, result card, event table, actions. Fits 1024×600. */
:root{
  --bg:#ffffff; --panel:#f7f9fb; --line:#dfe3e8; --fg:#16191d; --muted:#6b737c;
  --accent:#0070d2; --accent-fg:#ffffff; --good:#2e844a; --warn:#b86e00; --bad:#c23934; --gap:#eef1f4;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16191d; --panel:#1d2126; --line:#30363d; --fg:#e6e9ed; --muted:#9aa3ad;
  --accent:#3d9bf0; --accent-fg:#0b1016; --good:#5cc27e; --warn:#e3a33a; --bad:#f0716b; --gap:#242a31; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tile{width:30px;height:30px;border-radius:4px;background:var(--accent);display:grid;place-items:center}
.tile svg{width:18px;height:18px}
h1{font-size:16px;font-weight:600;margin:0}
.unit{color:var(--muted)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--bad)}
.pill.off{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batt{width:34px;height:16px;border:1.5px solid var(--fg);border-radius:3px;padding:1.5px;position:relative;flex:none}
.batt::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;background:var(--fg);border-radius:0 1px 1px 0}
.batt i{display:block;height:100%;background:var(--accent);border-radius:1px}
.batt.low i{background:var(--bad)} .batt.chg i{background:var(--good)}
.chart{border:1px solid var(--line);border-radius:4px;padding:8px 8px 4px}
.chart svg{width:100%;height:170px;display:block}
.chart .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:0 4px 4px}
.sw{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
.tablebox{border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:220px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{height:22px;padding:0 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:12px;color:var(--muted)}
td.n,th.n{text-align:right}
tr.ev td{font-weight:600}
tr.gap td{background:var(--gap);color:var(--muted)}
tr.alarm td{color:var(--bad);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;height:28px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
input[type=number]{font:inherit;width:56px;height:28px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.confirm{display:inline-flex;gap:8px;align-items:center;color:var(--bad)}
.report{border:1px solid var(--line);border-radius:4px}
.report h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.kv div{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;min-width:0}
.kv div span:first-child{color:var(--muted)}
/* Result shown: compact so the action bar stays on screen at 1024×600 */
body.done .chart svg{height:110px} body.done .tablebox{max-height:112px} body.done .kv div{padding:5px 12px} body.done .report h2{padding:6px 12px} body.done .files{padding:5px 12px}
body.done .bar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:8px 0}
.files.bad{color:var(--bad)}
.files{padding:8px 12px;color:var(--muted);font-family:var(--mono);font-size:12px;word-break:break-all}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.box{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--bad);border-radius:6px;padding:18px 20px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.box b{font-size:28px;color:var(--bad)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><path d="M11 9l-2 3h4l-2 3"/></svg></div>
    <h1>Battery Logger</h1>
    <span class="unit" id="unit"></span>
    <span class="spacer"></span>
    <span class="pill" id="helper"><span class="dot"></span>Windows data</span>
  </header>

  <section class="stats" aria-label="Battery now">
    <div class="stat"><span class="k">Charge</span><span class="v"><span class="batt" id="battIcon"><i id="battFill" style="width:0%"></i></span><span id="pct">--%</span></span><span class="s" id="pctSub">n/a</span></div>
    <div class="stat"><span class="k">Health</span><span class="v" id="health">n/a</span><span class="s" id="healthSub">n/a</span></div>
    <div class="stat"><span class="k">Power</span><span class="v" id="watts">n/a</span><span class="s" id="wattsSub">n/a</span></div>
    <div class="stat"><span class="k">Elapsed</span><span class="v" id="elapsed">0:00:00</span><span class="s" id="eta">Ready</span></div>
  </section>

  <section class="chart" aria-label="Charge over time">
    <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Charge %</span><span><i class="sw" style="background:var(--warn)"></i>Watts</span><span><i class="sw" style="background:var(--gap);height:8px"></i>Gap</span></div>
    <svg id="chart" viewBox="0 0 1000 170" preserveAspectRatio="none" role="img" aria-label="Charge and power over time"></svg>
  </section>

  <section id="reportBox" class="report" hidden></section>

  <section class="tablebox" aria-label="Log">
    <table><thead><tr><th>Time</th><th>Event</th><th class="n">%</th><th class="n">Wh</th><th class="n">W</th><th class="n">Elapsed</th></tr></thead><tbody id="rows"></tbody></table>
  </section>

  <div class="bar">
    <button class="primary" id="startBtn">Start</button>
    <span class="confirm" id="startMsg" hidden>Charge to at least 96% first.</span>
    <button class="danger" id="stopBtn" disabled>Stop</button>
    <span class="confirm" id="stopConfirm" hidden>End the test now? <button class="danger" id="stopYes">End test</button><button id="stopNo">Keep running</button></span>
    <span class="spacer"></span>
    <label class="f" for="alarmPct">Alarm at <input type="number" id="alarmPct" min="10" max="50" value="15">%</label>
    <span class="confirm" id="csvMsg" hidden></span>
    <button id="exportBtn">Save CSV</button>
  </div>
</div>

<div class="ov" id="alarm" hidden role="alertdialog" aria-labelledby="alarmT">
  <div class="box">
    <b id="alarmPctV">15%</b>
    <div id="alarmT">Plug in the charger. The test is done and the report is saved to the Desktop.</div>
    <button class="primary" id="alarmOk">OK</button>
  </div>
</div>

<!-- The one report template. The exe fills it (Report.cs) and so does browser-only mode (fillReport). -->
<template id="report"><!-- Slots (api-contract.md; plain = escaped, *Html = raw): unitModel, unitSerial, computerName, date, startTime, endTime,
reason, startEnd, runtime, estFull, estFullEnergy, avgW, minW, maxW, healthPct, batteryRowsHtml, gapsPauses, saver,
brightness, plan, windows, alarmNote, chartSvgHtml, eventRowsHtml, eventsMore, version --><meta charset="utf-8"><title>Battery {{unitSerial}} {{date}}</title>
<style>
body{margin:0;font:12px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#16191d;background:#fff;font-variant-numeric:tabular-nums}
.r{max-width:760px;margin:0 auto;padding:16px}
.h{display:flex;align-items:center;gap:10px;border-bottom:1px solid #dfe3e8;padding-bottom:8px;flex-wrap:wrap}
.h b{font-size:16px}.h span{color:#6b737c}.res{margin-left:auto;font-weight:600;color:#0070d2}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #dfe3e8;border-radius:4px;margin:10px 0}
.kv div{padding:5px 10px;border-bottom:1px solid #dfe3e8;display:flex;justify-content:space-between;gap:8px}
.kv div span:first-child{color:#6b737c}
.note{color:#c23934;font-weight:600}
table{border-collapse:collapse;width:100%;margin:8px 0}
th,td{height:20px;padding:0 8px;text-align:left;border-bottom:1px solid #dfe3e8;white-space:nowrap}
th{background:#f7f9fb;color:#6b737c;font-weight:600}td.n,th.n{text-align:right}
tr.gap td{background:#eef1f4;color:#6b737c}tr.alarm td{color:#c23934;font-weight:600}tr.ev td{font-weight:600}
.chart{border:1px solid #dfe3e8;border-radius:4px;padding:6px}.more,.f{color:#6b737c}.f{margin-top:10px;font-size:11px}
@media print{@page{size:A4;margin:10mm}.r{padding:0}}
</style>
<div class="r">
<div class="h"><b>Battery Logger</b><span>{{unitModel}} · {{unitSerial}} · {{computerName}}</span><span class="res">{{reason}}</span></div>
<div class="note">{{alarmNote}}</div>
<div class="kv">
<div><span>Date</span><span>{{date}} {{startTime}}–{{endTime}}</span></div>
<div><span>Runtime</span><span>{{runtime}} ({{startEnd}})</span></div>
<div><span>est. 100→0%</span><span>{{estFull}}</span></div>
<div><span>Energy method</span><span>{{estFullEnergy}}</span></div>
<div><span>Average draw</span><span>{{avgW}}</span></div>
<div><span>Min / max</span><span>{{minW}} / {{maxW}}</span></div>
<div><span>Health</span><span>{{healthPct}}</span></div>
<div><span>Gaps / pauses</span><span>{{gapsPauses}}</span></div>
<div><span>Battery saver</span><span>{{saver}}</span></div>
<div><span>Brightness</span><span>{{brightness}}</span></div>
<div><span>Power plan</span><span>{{plan}}</span></div>
<div><span>Windows</span><span>{{windows}}</span></div>
</div>
<table class="bt"><thead><tr><th>Battery</th><th>Maker</th><th>Chemistry</th><th class="n">Design Wh</th><th class="n">Full Wh</th><th class="n">Cycles</th><th class="n">Health</th></tr></thead>{{batteryRowsHtml}}</table>
<div class="chart">{{chartSvgHtml}}</div>
<table class="ev"><thead><tr><th>Time</th><th>Event</th><th class="n">%</th><th class="n">Wh</th><th class="n">W</th><th class="n">Elapsed</th></tr></thead>{{eventRowsHtml}}</table>
<div class="more">{{eventsMore}}</div>
<div class="f">Battery Logger v14 · Windows data · {{version}}</div>
</div></template>

<script src="logic.js"></script>
<script>
'use strict';
(function () {
var L = window.LaptapLogic;
var $ = function (id) { return document.getElementById(id); };
var FILE = location.protocol === 'file:';

// ---- token: read from #t=, keep in memory, remove from the address bar ----
var token = (location.hash.match(/[#&]t=([0-9a-f]+)/) || [])[1] || '';
try {
  if (token) sessionStorage.setItem('laptapBatteryToken', token);   // this window only; gone when it closes
  else if (!FILE) token = sessionStorage.getItem('laptapBatteryToken') || '';
} catch (e) {}
if (location.hash) history.replaceState(null, '', location.pathname + location.search);

var st = { rev: 0, samples: [], events: [], snap: null, lastListed: null, sessionId: null, chartKey: null };
var fails = 0, lost = false, lastHb = 0, pollTimer = null, dismissed = null, alarmPctIdle = 15;
var audio = null, beepTimer = null, ackedId = null;

function api(path, method, body) {
  if (FILE) return Local.request(path, method || 'GET', body);
  var h = { 'X-Laptap-Token': token };
  if (body) h['Content-Type'] = 'application/json';
  return fetch(path, { method: method || 'GET', headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

// ---- polling: 5 s visible, 30 s hidden; heartbeat every 60 s rides along. No 1-second timer. ----
function poll() {
  clearTimeout(pollTimer);
  var p = Promise.resolve();
  if (Date.now() - lastHb >= 60000) { lastHb = Date.now(); p = api('/api/heartbeat', 'POST').catch(function () {}); }
  return p.then(function () { return api('/api/state?since=' + st.rev); })
    .then(function (s) { fails = 0; apply(s); }, function () { if (++fails >= 3) loggerLost(); })
    .then(function () { if (!lost) pollTimer = setTimeout(poll, document.hidden ? 30000 : 5000); });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && !lost) poll(); });

// ---- compare-before-write: nothing changed → nothing written to the DOM (F1) ----
function setText(id, t) { var el = $(id); if (el.textContent !== t) el.textContent = t; }
function setProp(id, k, v) { var el = $(id); if (el[k] !== v) el[k] = v; }
function setStyle(id, k, v) { var el = $(id); if (el.style[k] !== v) el.style[k] = v; }
function setHtml(id, h) { var el = $(id); if (el.__h !== h) { el.__h = h; el.innerHTML = h; } }

function loggerLost() {
  lost = true;
  setProp('helper', 'className', 'pill off');
  setHtml('helper', '<span class="dot off"></span>Logger stopped. Open Laptap Battery Logger again.');
  ['startBtn', 'stopBtn', 'exportBtn', 'stopYes', 'alarmPct'].forEach(function (id) { setProp(id, 'disabled', true); });
}

// ---- formatting ----
function wh(m) { return m == null ? '' : (m / 1000).toFixed(1); }
function w(mw) { return mw == null ? '' : (mw / 1000).toFixed(1); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function clock(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function pct(p) { return p == null ? 'n/a' : p + '%'; }

// §7 table wording, made from the contract's event type + note.
function eventLabel(e) {
  switch (e.type) {
    case 'start': return 'Test started';
    case 'waiting_unplug': return 'Waiting for unplug';
    case 'unplugged': return 'Unplugged';
    case 'charger_in': return 'Charger plugged in · paused';
    case 'charger_out': return 'Unplugged · resumed';
    case 'gap': return 'Gap ' + L.fmtHm(((e.toMs || e.ms) - (e.fromMs || e.ms)) / 1000) + ' · ' + (e.note && e.note !== 'unknown' ? 'laptop ' + e.note : 'unknown');
    case 'saver_on': return 'Battery saver on';
    case 'saver_off': return 'Battery saver off';
    case 'alarm': return 'Alarm at ' + pct(e.pct);
    case 'stop': return 'Stopped by tech';
    case 'hibernated': return L.endReason('hibernated', e.pct, e.elapsedS);
    case 'recovered': return L.endReason(e.note || 'logger_stopped', e.pct, e.elapsedS);
    case 'report_saved': return 'Report saved';
    case 'report_failed': return 'Report not saved to the Desktop';
    default: return e.type;
  }
}
function eventKind(e) { return e.type === 'gap' ? 'gap' : (e.type === 'alarm' || e.type === 'report_failed' ? 'alarm' : 'ev'); }

function activeSession(s) { return s && s.session && s.session.id !== dismissed ? s.session : null; }

// Counted seconds: Σ segments (an open segment runs to now).
function countedS(sess) {
  var t = 0, now = Date.now();
  (sess.segments || []).forEach(function (g) { t += ((g.endMs == null ? now : g.endMs) - g.startMs) / 1000; });
  return Math.max(0, t);
}
function gapsOf(events) { return events.filter(function (e) { return e.type === 'gap' && e.fromMs != null; }).map(function (e) { return { fromMs: e.fromMs, toMs: e.toMs }; }); }
function pausesOf(events) {
  var out = [], cur = null;
  events.forEach(function (e) {
    if (e.type === 'charger_in') cur = { fromMs: e.ms, toMs: null };
    else if (cur && (e.type === 'charger_out' || e.type === 'stop' || e.type === 'alarm')) { cur.toMs = e.ms; out.push(cur); cur = null; }
  });
  if (cur) out.push(cur);
  return out;
}

function apply(s) {
  if (st.snap && s.rev < st.rev) { st.rev = 0; st.samples = []; st.events = []; setHtml('rows', ''); st.lastListed = null; }
  var sess = s.session;
  if (sess && sess.id !== st.sessionId) { st.sessionId = sess.id; st.samples = []; st.events = []; setHtml('rows', ''); st.lastListed = null; }
  var newRows = [];
  (s.samples || []).forEach(function (x) {
    st.samples.push(x);
    if (st.lastListed == null || x.ms - st.lastListed >= 600000) { st.lastListed = x.ms; newRows.push({ rev: x.rev, ms: x.ms, label: 'Reading', kind: '', pct: x.pct, mwh: x.mwh, rateMw: x.rateMw, elapsedS: x.elapsedS }); }
  });
  (s.events || []).forEach(function (e) {
    st.events.push(e);
    newRows.push({ rev: e.rev, ms: e.ms, label: eventLabel(e), kind: eventKind(e), pct: e.pct, mwh: e.mwh, rateMw: e.rateMw, elapsedS: e.elapsedS });
  });
  newRows.sort(function (a, b) { return a.rev - b.rev; });
  st.rev = Math.max(st.rev, s.rev || 0);
  st.snap = s;
  if (activeSession(s)) addRows(newRows);
  render(s);
}

function addRows(list) {
  if (!list.length) return;
  var html = '';
  list.forEach(function (r) {
    html = '<tr class="' + (r.kind || '') + '"><td>' + clock(r.ms) + '</td><td>' + L.escapeHtml(r.label) + '</td><td class="n">' +
      (r.pct == null ? '' : r.pct) + '</td><td class="n">' + wh(r.mwh) + '</td><td class="n">' + w(r.rateMw) + '</td><td class="n">' +
      L.fmtElapsed(r.elapsedS) + '</td></tr>' + html;
  });
  var el = $('rows'); el.__h = null;
  el.insertAdjacentHTML('afterbegin', html);
}

// Live health = logic.health over Σ batteries (contract); shown capped at 100.
function healthOf(bats) {
  var full = 0, design = 0, ok = bats.length > 0;
  bats.forEach(function (b) { if (b.fullMwh == null || b.designMwh == null) ok = false; else { full += b.fullMwh; design += b.designMwh; } });
  if (!ok) return { shown: null, full: null, design: null };
  return { shown: L.health(full, design).shown, full: full, design: design };
}
function cyclesText(bats) {   // F2: one value per battery, "n/a" only where a battery reports none
  if (!bats.length) return 'n/a';
  return bats.map(function (b) { return b.cycles == null ? 'n/a' : String(b.cycles); }).join(' / ');
}

function render(s) {
  var n = s.now || {}, sess = activeSession(s), bats = s.batteries || [];
  var u = s.unit || {};
  setText('unit', [u.model || u.maker || '', u.serial || ''].filter(Boolean).join(' · '));
  if (!lost) {
    setProp('helper', 'className', FILE ? 'pill off' : 'pill');
    setHtml('helper', FILE ? '<span class="dot off"></span>Browser only · no health' : '<span class="dot"></span>Windows data');
  }
  var alarmPct = sess ? sess.alarmPct : alarmPctIdle;
  if (document.activeElement !== $('alarmPct') && $('alarmPct').value !== String(alarmPct)) $('alarmPct').value = alarmPct;

  // Charge
  setText('pct', n.pct == null ? '--%' : n.pct + '%');
  setStyle('battFill', 'width', (n.pct || 0) + '%');
  setProp('battIcon', 'className', 'batt' + (n.ac ? ' chg' : (n.pct != null && n.pct <= alarmPct ? ' low' : '')));
  setText('pctSub', n.mwh != null && n.fullMwh != null ? wh(n.mwh) + ' of ' + wh(n.fullMwh) + ' Wh' : (n.mwh != null ? wh(n.mwh) + ' Wh' : 'n/a'));
  // Health (number only, D13)
  var h = healthOf(bats);
  setText('health', h.shown == null ? 'n/a' : h.shown.toFixed(1) + '%');
  setText('healthSub', h.full != null ? wh(h.full) + ' / ' + wh(h.design) + ' Wh design · cycles ' + cyclesText(bats) : 'n/a');
  // Power (bug 13)
  setText('watts', n.ac ? 'On AC' : (n.rateMw != null ? w(n.rateMw) + ' W' : 'n/a'));
  setText('wattsSub', n.pct == null && n.ac == null ? 'n/a' : L.powerState(!!n.ac, !!n.charging, n.pct));
  // Elapsed + ETA
  var el = 0, eta = 'Ready';
  if (sess) {
    el = countedS(sess);
    if (sess.status === 'waiting') eta = 'Waiting for unplug';
    else if (sess.status === 'paused') eta = 'Paused · charger connected';
    else if (sess.status === 'running') {

  function state(since) {
    var p = pctNow(), segs = [];
    if (S) { segs = S.segments.slice(); if (S.open) segs.push({ startMs: S.open.startMs, endMs: null, startPct: S.open.startPct, endPct: null, startMwh: null, endMwh: null }); }
    return {
      rev: rev, version: '14.0.0',
      unit: { maker: '', model: 'Browser only', serial: null, computerName: null }, batteries: [],
      now: { pct: p, mwh: null, fullMwh: null, rateMw: null, ac: bat ? bat.charging : null, charging: bat ? bat.charging && p < 100 : false, saver: false },
      session: S ? { id: S.id, status: S.status, startedMs: S.startedMs, waitingSinceMs: S.waitingSinceMs || null, alarmPct: S.alarmPct, alarmPctMax: 50,
        alarm: !!S.alarm, alarmAck: !!S.alarmAck, segments: segs } : null,
      samples: S ? samples.filter(function (x) { return x.rev > since; }) : [],
      events: S ? S.events.filter(function (e) { return e.rev > since; }) : [],
      result: S && S.status === 'done' ? summary() : null
    };
  }

  function request(path, method, body) {
    return ready.then(function () {
      var name = path.replace(/^\/api\//, '').replace(/\?.*$/, '');
      if (method === 'GET') return state(+((path.match(/since=(\d+)/) || [])[1] || 0));
      switch (name) {
        case 'heartbeat': return { ok: true };
        case 'start':
          if (active()) return { ok: false, error: 'A test is already running.' };
          if (failed || !bat || !L.canStart(pctNow())) return { ok: false, error: 'Charge to at least 96% first.' };
          S = { id: 'b' + now(), status: 'waiting', startedMs: now(), waitingSinceMs: null, alarmPct: alarmPct, segments: [], open: null, gaps: [], pauses: [], events: [], lastMs: null, lastPct: null };
          samples = [];
          var x = sample('start');
          event('start', x);
          if (bat.charging) { S.waitingSinceMs = x.ms; event('waiting_unplug', x); }
          else { S.status = 'running'; S.startPct = x.pct; openSeg(x); }
          wake(); save(); schedule();
          return { ok: true };
        case 'stop': if (!active()) return { ok: false, error: 'No test is running.' }; end('stop'); return { ok: true };
        case 'ack-alarm': if (S) { S.alarmAck = true; save(); } return { ok: true };
        case 'alarm-pct':
          var v = body && body.pct;
          if (!(v >= 10 && v <= 50)) return { ok: false, error: 'Alarm must be 10 to 50%.' };
          alarmPct = v; if (active()) S.alarmPct = v; save(); return { ok: true };
        case 'save-csv': if (!S) return { ok: false, error: 'No test yet.' }; download(baseName() + '.csv', csvText(), 'text/csv'); return { ok: true, file: baseName() + '.csv' };
      }
      return { ok: false, error: 'Unknown command.' };
    });
  }
  return { request: request };
})();

poll();
})();
</script>
